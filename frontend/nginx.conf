# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
server {
  listen 80;
  root /usr/share/nginx/html;

  # En-têtes de sécurité (gabarit de la plateforme, core-platform/templates/nginx.conf),
  # avec un connect-src limité à l'origine : pas d'appel direct au magasin d'objets ni à un autre port.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
